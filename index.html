<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aiden's Browser</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d0d1a;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    /* =========================
       LOGIN
    ========================= */

    #login {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #login h1 {
      font-size: 3rem;
      margin: 0 0 10px;

      text-shadow:
        0 0 5px white,
        0 0 10px white,
        0 0 20px #00d4ff,
        0 0 30px #00d4ff,
        0 0 40px #00d4ff;
    }

    #login h2 {
      color: #ddd;
      margin-bottom: 25px;
    }

    #password {
      width: 260px;
      padding: 13px;

      background: #17172a;
      color: white;

      border: 2px solid #00d4ff;
      border-radius: 6px;

      outline: none;
      font-size: 16px;

      box-shadow: 0 0 10px #00d4ff;
    }

    #loginButton {
      margin-top: 12px;

      padding: 12px 28px;

      border: none;
      border-radius: 6px;

      background: #00d4ff;
      color: white;

      font-weight: bold;
      font-size: 16px;

      cursor: pointer;

      box-shadow: 0 0 12px #00d4ff;
    }

    #loginButton:hover {
      background: #0099cc;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }


    /* =========================
       BROWSER
    ========================= */

    #browser {
      display: none;
      height: 100vh;
      width: 100%;
      background: #101018;

      /* Stack the bars on top, and let the
         content area fill whatever is left. */
      flex-direction: column;
    }


    /* TOP BAR */

    .topbar {
      height: 58px;

      display: flex;
      align-items: center;

      gap: 7px;

      padding: 8px 12px;

      background: #181824;

      border-bottom: 1px solid #303044;
    }


    /* BUTTONS */

    .nav {
      width: 38px;
      height: 38px;

      border: none;
      border-radius: 7px;

      background: #242438;
      color: #ddd;

      font-size: 20px;

      cursor: pointer;
    }

    .nav:hover {
      background: #30304a;
      color: white;
    }

    /* Greyed out when there's nowhere to go */
    .nav:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .nav:disabled:hover {
      background: #242438;
      color: #ddd;
    }


    /* ADDRESS BAR */

    #url {
      flex: 1;

      height: 38px;

      padding: 0 15px;

      border: 1px solid #36364e;
      border-radius: 20px;

      background: #0e0e19;
      color: white;

      outline: none;

      font-size: 14px;
    }

    #url:focus {
      border-color: #00d4ff;

      box-shadow:
        0 0 8px rgba(0, 212, 255, 0.4);
    }

    #go {
      height: 38px;

      padding: 0 18px;

      border: none;
      border-radius: 7px;

      background: #00d4ff;
      color: white;

      font-weight: bold;

      cursor: pointer;
    }

    #go:hover {
      background: #0099cc;
    }


    /* TAB BAR */

    .tabs {
      height: 38px;

      display: flex;
      align-items: flex-end;

      background: #0c0c14;

      padding-left: 10px;
    }

    .tab {
      height: 32px;

      min-width: 190px;
      max-width: 260px;

      padding: 8px 15px;

      background: #181824;

      border-radius: 7px 7px 0 0;

      color: #ddd;

      font-size: 13px;

      /* Long site names get "..." instead of overflowing */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* NOTICE BAR (for sites that block iframes) */

    #notice {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      padding: 6px 14px;

      background: #1c1c2e;
      color: #aaa;

      font-size: 13px;

      border-bottom: 1px solid #303044;
    }

    /* Without this, "display: flex" above would
       beat the hidden attribute and never hide it */
    #notice[hidden] {
      display: none;
    }

    #openNewTab {
      padding: 5px 12px;

      border: 1px solid #00d4ff;
      border-radius: 6px;

      background: transparent;
      color: #00d4ff;

      font-size: 13px;

      cursor: pointer;
    }

    #openNewTab:hover {
      background: #00d4ff;
      color: #0d0d1a;
    }


    /* CONTENT */

    #content {
      width: 100%;

      /* Fill all the space left under the bars */
      flex: 1;
      min-height: 0;

      background: white;
    }

    #webview {
      width: 100%;
      height: 100%;

      border: none;

      background: white;
    }


    /* HOME */

    #home {
      height: 100%;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      background:
        radial-gradient(
          circle at center,
          #14142a,
          #080810
        );
    }

    #home h1 {
      font-size: 42px;

      margin-bottom: 10px;

      text-shadow:
        0 0 10px #00d4ff;
    }

    #home p {
      color: #888;
    }

  </style>
</head>

<body>


  <!-- =========================
       LOGIN SCREEN
  ========================= -->

  <div id="login">

    <h1>Welcome To Aiden's Safe Place</h1>

    <h2>Type In Password</h2>

    <input
      id="password"
      type="password"
      placeholder="Enter password"
    >

    <button id="loginButton">
      Submit
    </button>

    <div id="message"></div>

  </div>



  <!-- =========================
       BROWSER
  ========================= -->

  <div id="browser">


    <div class="topbar">

      <button id="backButton" class="nav" onclick="back()" title="Back" disabled>
        ←
      </button>

      <button id="forwardButton" class="nav" onclick="forward()" title="Forward" disabled>
        →
      </button>

      <button class="nav" onclick="reload()" title="Reload">
        ⟳
      </button>

      <button class="nav" onclick="goHome()" title="Home">
        ⌂
      </button>


      <input
        id="url"
        type="text"
        placeholder="Enter a website or search..."
      >

      <button id="go" onclick="navigate()">
        Go
      </button>

    </div>


    <div class="tabs">

      <div class="tab" id="tabTitle">
        🌐 Aiden's Browser
      </div>

    </div>


    <!-- Shown only while a website is open -->
    <div id="notice" hidden>

      <span>
        Page blank? Some sites block being shown inside other pages.
      </span>

      <button id="openNewTab" onclick="openInNewTab()">
        Open in new tab ↗
      </button>

    </div>


    <div id="content">

      <div id="home">

        <h1>Aiden's Browser</h1>

        <p>
          Enter a website above to get started.
        </p>

      </div>

      <iframe
        id="webview"
        style="display:none;"
        title="Web Browser"
      ></iframe>

    </div>

  </div>



  <script>

    const passwordInput =
      document.getElementById("password");

    const message =
      document.getElementById("message");


    /* LOGIN */

    function login() {

      if (passwordInput.value === "1234") {

        message.style.color = "#00ffcc";
        message.textContent = "Access Granted!";

        setTimeout(() => {

          document.getElementById("login").style.display =
            "none";

          document.getElementById("browser").style.display =
            "flex";

        }, 400);

      } else {

        message.style.color = "#ff0055";
        message.textContent =
          "Incorrect Password. Try again.";

      }

    }


    document
      .getElementById("loginButton")
      .addEventListener("click", login);


    passwordInput.addEventListener("keydown", event => {

      if (event.key === "Enter") {
        login();
      }

    });


    /* =========================
       BROWSER FUNCTIONS
    ========================= */

    /*
      Our own history list.

      We can't read the iframe's real history
      (the browser blocks that for other websites),
      so we remember every page ourselves.

      historyList  = every address we've visited
      historyIndex = which one we're on right now
                     (-1 means the home screen)
    */

    let historyList = [];
    let historyIndex = -1;


    function navigate() {

      let address =
        document.getElementById("url").value.trim();

      if (!address) return;


      /*
        If the user doesn't type a protocol,
        assume HTTPS.
      */

      if (
        !address.startsWith("http://") &&
        !address.startsWith("https://")
      ) {

        /*
          Treat normal text as a Google search.
        */

        if (
          !address.includes(".") ||
          address.includes(" ")
        ) {

          address =
            "https://www.google.com/search?q=" +
            encodeURIComponent(address);

        } else {

          address = "https://" + address;

        }

      }


      /*
        If we went back and then visit a new page,
        the old "forward" pages get thrown away
        (that's how real browsers work too).
      */

      historyList = historyList.slice(0, historyIndex + 1);

      historyList.push(address);

      historyIndex = historyList.length - 1;

      showPage(address);

    }


    /* Show a website (doesn't touch history) */

    function showPage(address) {

      const iframe =
        document.getElementById("webview");


      document.getElementById("home").style.display = "none";

      document.getElementById("notice").hidden = false;

      iframe.style.display = "block";

      iframe.src = address;

      document.getElementById("url").value = address;

      /* Put the site's name on the tab, like "wikipedia.org" */
      document.getElementById("tabTitle").textContent =
        "🌐 " + new URL(address).hostname.replace("www.", "");

      updateButtons();

    }


    /* Go back to the home screen */

    function goHome() {

      const iframe =
        document.getElementById("webview");


      iframe.style.display = "none";

      iframe.src = "about:blank";

      document.getElementById("home").style.display = "flex";

      document.getElementById("notice").hidden = true;

      document.getElementById("url").value = "";

      document.getElementById("tabTitle").textContent =
        "🌐 Aiden's Browser";

      historyIndex = -1;

      updateButtons();

    }


    /* Grey out back/forward when you can't use them */

    function updateButtons() {

      document.getElementById("backButton").disabled =
        historyIndex < 0;

      document.getElementById("forwardButton").disabled =
        historyIndex >= historyList.length - 1;

    }


    /* ENTER IN ADDRESS BAR */

    document
      .getElementById("url")
      .addEventListener("keydown", event => {

        if (event.key === "Enter") {
          navigate();
        }

      });


    function back() {

      if (historyIndex > 0) {

        historyIndex--;

        showPage(historyList[historyIndex]);

      } else if (historyIndex === 0) {

        /* Going back from the first page = home screen */
        goHome();

      }

    }


    function forward() {

      if (historyIndex < historyList.length - 1) {

        historyIndex++;

        showPage(historyList[historyIndex]);

      }

    }


    function reload() {

      if (historyIndex >= 0) {
        showPage(historyList[historyIndex]);
      }

    }


    /* For sites that refuse to load in the iframe */

    function openInNewTab() {

      if (historyIndex >= 0) {

        /* "noopener" stops the new page from being
           able to control this page (a safety habit) */
        window.open(historyList[historyIndex], "_blank", "noopener");

      }

    }

  </script>

</body>
</html>
