```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aiden's Safe Place</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #0d0d1a;
      color: white;
    }

    /* LOGIN SCREEN */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;

      text-shadow:
        0 0 5px #fff,
        0 0 10px #fff,
        0 0 20px #00d4ff,
        0 0 30px #00d4ff,
        0 0 40px #00d4ff;
    }

    h2 {
      color: #e0e0e0;
      margin-bottom: 20px;
      text-shadow: 0 0 8px #00d4ff;
    }

    #passwordInput {
      padding: 12px 15px;
      width: 250px;

      font-size: 1rem;

      border: 2px solid #00d4ff;
      border-radius: 5px;

      background: #1a1a2e;
      color: white;

      outline: none;

      box-shadow: 0 0 10px #00d4ff;
    }

    button {
      padding: 12px 20px;
      margin-top: 10px;

      font-size: 1rem;
      font-weight: bold;

      color: white;
      background: #00d4ff;

      border: none;
      border-radius: 5px;

      cursor: pointer;

      box-shadow: 0 0 10px #00d4ff;
    }

    button:hover {
      background: #0099cc;
      box-shadow: 0 0 15px #0099cc;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }


    /* BROWSER SCREEN */

    #browserScreen {
      display: none;
      min-height: 100vh;
    }


    /* TOP BAR */

    .topbar {
      height: 65px;

      display: flex;
      align-items: center;

      padding: 10px 15px;

      background: #111122;

      border-bottom: 2px solid #00d4ff;

      box-shadow: 0 0 15px #00d4ff;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;

      margin-right: 15px;

      color: #00d4ff;
    }


    /* SEARCH BAR */

    .searchForm {
      display: flex;

      flex: 1;

      max-width: 900px;
      margin: auto;
    }

    .searchForm input {
      flex: 1;

      padding: 12px 15px;

      font-size: 16px;

      border: 2px solid #00d4ff;
      border-right: none;

      border-radius: 6px 0 0 6px;

      outline: none;

      background: #1a1a2e;
      color: white;
    }

    .searchForm button {
      margin: 0;

      border-radius: 0 6px 6px 0;

      box-shadow: none;
    }


    /* HOME */

    #home {
      min-height: calc(100vh - 65px);

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;
    }

    #home h1 {
      font-size: 4rem;
      margin-bottom: 5px;
    }

    #home p {
      color: #aaa;
      font-size: 18px;
    }


    /* QUICK BUTTONS */

    .quickLinks {
      margin-top: 25px;

      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .quickLinks button {
      margin: 0;
      background: #1a1a2e;
      border: 1px solid #00d4ff;
    }

    .quickLinks button:hover {
      background: #00d4ff;
    }
  </style>
</head>


<body>


  <!-- ========================= -->
  <!-- LOGIN -->
  <!-- ========================= -->

  <div id="loginScreen">

    <h1>Welcome To Aiden's Safe Place</h1>

    <h2>Type In Password</h2>

    <input
      type="password"
      id="passwordInput"
      placeholder="Enter password"
    >

    <button onclick="checkPassword()">
      Submit
    </button>

    <div id="message"></div>

  </div>



  <!-- ========================= -->
  <!-- BROWSER -->
  <!-- ========================= -->

  <div id="browserScreen">


    <!-- TOP BAR -->

    <div class="topbar">

      <div class="logo">
        AIDEN
      </div>


      <!-- SEARCH -->

      <form
        class="searchForm"
        action="https://duckduckgo.com/"
        method="GET"
        target="_blank"
      >

        <input
          type="text"
          name="q"
          placeholder="Search the web..."
          autocomplete="off"
        >

        <button type="submit">
          Search
        </button>

      </form>

    </div>



    <!-- HOME -->

    <div id="home">

      <h1>
        Search
      </h1>

      <p>
        Search the web with DuckDuckGo
      </p>


      <div class="quickLinks">

        <button onclick="openSite('https://duckduckgo.com')">
          DuckDuckGo
        </button>

        <button onclick="openSite('https://github.com')">
          GitHub
        </button>

        <button onclick="openSite('https://www.google.com')">
          Google
        </button>

      </div>

    </div>


  </div>



  <!-- ========================= -->
  <!-- JAVASCRIPT -->
  <!-- ========================= -->

  <script>


    function checkPassword() {

      const password =
        document.getElementById("passwordInput").value;

      const message =
        document.getElementById("message");


      if (password === "1234") {

        message.style.color = "#00ffcc";

        message.style.textShadow =
          "0 0 10px #00ffcc";

        message.textContent =
          "Access Granted!";


        setTimeout(function() {

          document.getElementById("loginScreen").style.display =
            "none";

          document.getElementById("browserScreen").style.display =
            "block";

        }, 500);


      } else {

        message.style.color = "#ff0055";

        message.style.textShadow =
          "0 0 10px #ff0055";

        message.textContent =
          "Incorrect Password. Try again.";

      }

    }



    function openSite(url) {

      window.open(
        url,
        "_blank"
      );

    }


  </script>


</body>
</html>
```
