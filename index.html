<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome To Aiden's Safe Place</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0d0d1a;
      color: #fff;
      padding-top: 80px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      text-align: center;
      color: #fff;
      text-shadow:
        0 0 5px #fff,
        0 0 10px #fff,
        0 0 20px #00d4ff,
        0 0 30px #00d4ff,
        0 0 40px #00d4ff;
    }

    h2 {
      font-size: 1.5rem;
      color: #e0e0e0;
      margin-bottom: 20px;
      text-shadow: 0 0 8px #00d4ff;
    }

    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    input[type="password"] {
      padding: 10px 15px;
      font-size: 1rem;
      border: 2px solid #00d4ff;
      border-radius: 5px;
      background-color: #1a1a2e;
      color: #fff;
      outline: none;
      box-shadow: 0 0 10px #00d4ff;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      color: #fff;
      background-color: #00d4ff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 0 10px #00d4ff;
      font-weight: bold;
    }

    button:hover {
      background-color: #0099cc;
      box-shadow: 0 0 15px #0099cc;
    }

    #message {
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    /* Search section */
    #search-section {
      display: none;
      width: 90%;
      max-width: 1000px;
      margin-top: 30px;
    }

    .search-box {
      background: #111122;
      border: 1px solid #00d4ff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.25);
    }

    .search-title {
      text-align: center;
      color: #00d4ff;
      font-size: 1.5rem;
      margin-bottom: 15px;
    }

    /* Google search styling */
    .gsc-control-cse {
      background-color: transparent !important;
      border: none !important;
    }

    .gsc-search-box-tools .gsc-search-box {
      margin-bottom: 10px;
    }
  </style>

  <!-- Google Programmable Search -->
  <script async src="https://cse.google.com/cse.js?cx=f46f21df2aa95439e"></script>
</head>

<body>

  <div id="login-screen">

    <h1>Welcome To Aiden's Safe Place</h1>

    <h2>Type In Password</h2>

    <div class="login-container">

      <input
        type="password"
        id="passwordInput"
        placeholder="Enter password"
      >

      <button onclick="checkPassword()">Submit</button>

      <div id="message"></div>

    </div>

  </div>


  <!-- SEARCH PAGE -->

  <div id="search-section">

    <div class="search-box">

      <div class="search-title">
        🔎 Search The Web
      </div>

      <div class="gcse-search"></div>

    </div>

  </div>


  <script>

    function checkPassword() {

      const input =
        document.getElementById("passwordInput").value;

      const message =
        document.getElementById("message");

      if (input === "1234") {

        message.style.color = "#00ffcc";
        message.style.textShadow = "0 0 10px #00ffcc";
        message.textContent = "Access Granted!";

        // Hide login
        document.getElementById("login-screen").style.display = "none";

        // Show search
        document.getElementById("search-section").style.display = "block";

      } else {

        message.style.color = "#ff0055";
        message.style.textShadow = "0 0 10px #ff0055";
        message.textContent = "Incorrect Password. Try again.";

      }

    }

    // Allow Enter key to submit password
    document.getElementById("passwordInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          checkPassword();
        }

      });

  </script>

</body>
</html>
